[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seabed-sentinel"
version = "0.1.0"
description = "Physics-grounded synthetic aperture sonar simulation, image formation and AI automatic target recognition for seabed survey and mine countermeasures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shahriar Rashid" }]
keywords = ["synthetic aperture sonar", "SAS", "ATR", "mine countermeasures", "underwater robotics", "AUV", "deep learning", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.1",
  "pillow>=10",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
  "onnx>=1.15",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sentinel = "seabed_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["seabed_sentinel*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "B008", "E402", "B023", "E702", "E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
